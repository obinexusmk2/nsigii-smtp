[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nsigii-smtp"
version = "0.1.0"
description = "NSIGII SMTP SDK and CLI for humanitarian message dispatch."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "OBINexus Computing" }
]
keywords = ["nsigii", "smtp", "humanitarian", "email", "cli"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
nsigii-smtp = "nsigii_smtp.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
